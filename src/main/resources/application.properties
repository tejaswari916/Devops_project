# ======================================================
# Inventory Management System - Application Configuration
# Active profile selects dev (H2) or prod (MySQL)
# ======================================================

# ---- Active Profile (override via env variable SPRING_PROFILES_ACTIVE) ----
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Application Info ----
spring.application.name=Inventory Management System
server.port=8080

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---- Admin Credentials (read from environment, defaults for dev) ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Logging ----
logging.level.com.inventory=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
