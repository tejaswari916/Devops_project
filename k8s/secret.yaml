# IMPORTANT: Replace base64 values before applying.
# Generate with: echo -n 'your-value' | base64
# Never commit real secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: inventory-system
type: Opaque
data:
  # echo -n 'inventory_user' | base64  ->  aW52ZW50b3J5X3VzZXI=
  DB_USERNAME: aW52ZW50b3J5X3VzZXI=
  # echo -n 'inventory_pass' | base64  ->  aW52ZW50b3J5X3Bhc3M=
  DB_PASSWORD: aW52ZW50b3J5X3Bhc3M=
  # echo -n 'admin' | base64  ->  YWRtaW4=
  ADMIN_USERNAME: YWRtaW4=
  # echo -n 'admin123' | base64  ->  YWRtaW4xMjM=
  ADMIN_PASSWORD: YWRtaW4xMjM=
  # echo -n 'rootpassword' | base64  ->  cm9vdHBhc3N3b3Jk
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk
