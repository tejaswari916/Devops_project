<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products - InvenTrack</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>
  <div class="main-content">
    <header class="top-header">
      <div>
        <div class="page-title">Products</div>
        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item active">All Products</li></ol></nav>
      </div>
      <a th:href="@{/products/new}" class="btn btn-primary btn-sm">&#43; Add Product</a>
    </header>
    <main class="content-area">
      <!-- Flash Messages -->
      <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
        <span>&#10003;</span><span th:text="${successMessage}"></span>
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
        <span>&#9888;</span><span th:text="${errorMessage}"></span>
      </div>

      <div class="content-card">
        <!-- Search & Filter -->
        <form th:action="@{/products}" method="get" class="search-bar">
          <div>
            <label class="form-label" for="search">Search</label>
            <input type="text" id="search" name="search" class="form-control"
                   placeholder="Name or SKU..." th:value="${search}" style="width:200px"/>
          </div>
          <div>
            <label class="form-label" for="category">Category</label>
            <select id="category" name="category" class="form-select" style="width:150px">
              <option value="">All Categories</option>
              <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"
                      th:selected="${cat == category}"></option>
            </select>
          </div>
          <div>
            <label class="form-label" for="stockStatus">Stock Status</label>
            <select id="stockStatus" name="stockStatus" class="form-select" style="width:150px">
              <option value="">All Status</option>
              <option value="IN_STOCK"      th:selected="${stockStatus == 'IN_STOCK'}">In Stock</option>
              <option value="LOW_STOCK"     th:selected="${stockStatus == 'LOW_STOCK'}">Low Stock</option>
              <option value="OUT_OF_STOCK"  th:selected="${stockStatus == 'OUT_OF_STOCK'}">Out of Stock</option>
            </select>
          </div>
          <div style="display:flex;gap:6px;align-items:flex-end">
            <button type="submit" class="btn btn-primary">&#128269; Search</button>
            <a th:href="@{/products}" class="btn btn-secondary">&#10005; Clear</a>
          </div>
        </form>

        <!-- Empty State -->
        <div th:if="${products.content.isEmpty()}" class="empty-state">
          <div class="empty-icon">&#128230;</div>
          <h5>No products found</h5>
          <p>Try adjusting your search or <a th:href="@{/products/new}">add a new product</a>.</p>
        </div>

        <!-- Product Table -->
        <div th:unless="${products.content.isEmpty()}" style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>
                  <a th:href="@{/products(search=${search},category=${category},stockStatus=${stockStatus},sort='name',dir=${sort=='name' and dir=='asc'?'desc':'asc'})}">
                    Product <span th:if="${sort=='name'}" th:text="${dir=='asc'?'&#9650;':'&#9660;'}"></span>
                  </a>
                </th>
                <th>SKU</th>
                <th>Category</th>
                <th>
                  <a th:href="@{/products(search=${search},category=${category},stockStatus=${stockStatus},sort='price',dir=${sort=='price' and dir=='asc'?'desc':'asc'})}">
                    Price <span th:if="${sort=='price'}" th:text="${dir=='asc'?'&#9650;':'&#9660;'}"></span>
                  </a>
                </th>
                <th>
                  <a th:href="@{/products(search=${search},category=${category},stockStatus=${stockStatus},sort='quantity',dir=${sort=='quantity' and dir=='asc'?'desc':'asc'})}">
                    Stock <span th:if="${sort=='quantity'}" th:text="${dir=='asc'?'&#9650;':'&#9660;'}"></span>
                  </a>
                </th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${products.content}"
                  th:data-href="@{/products/{id}(id=${p.id})}"
                  th:classappend="${p.outOfStock} ? 'out-of-stock-row' : (${p.lowStock} ? 'low-stock-row' : '')">
                <td>
                  <div class="fw-600" th:text="${p.name}"></div>
                  <div class="text-muted fs-12" th:text="${#strings.abbreviate(p.description?:'',60)}"></div>
                </td>
                <td><code th:text="${p.sku}"></code></td>
                <td class="text-muted" th:text="${p.category ?: '-'}"></td>
                <td class="fw-600" th:text="'$' + ${#numbers.formatDecimal(p.price,1,2)}"></td>
                <td>
                  <span class="fw-600"
                        th:classappend="${p.outOfStock} ? 'text-danger' : (${p.lowStock} ? 'text-warning' : 'text-success')"
                        th:text="${p.quantity}"></span>
                  <span class="text-muted fs-12"> / </span>
                  <span class="text-muted fs-12" th:text="${p.minStockThreshold}"></span>
                </td>
                <td>
                  <span class="stock-badge"
                        th:classappend="${p.outOfStock} ? 'badge-out-of-stock' : (${p.lowStock} ? 'badge-low-stock' : 'badge-in-stock')"
                        th:text="${p.stockStatus.replace('_',' ')}"></span>
                </td>
                <td onclick="event.stopPropagation()">
                  <div style="display:flex;gap:4px">
                    <a th:href="@{/products/{id}/edit(id=${p.id})}" class="btn btn-warning btn-sm" title="Edit">&#9998;</a>
                    <a th:href="@{/stock(productId=${p.id})}" class="btn btn-success btn-sm" title="Stock Movement">&#128260;</a>
                    <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" style="margin:0"
                          data-confirm="Delete this product? All transaction history will also be deleted.">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-danger btn-sm" title="Delete">&#128465;</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div th:if="${products.totalPages > 1}"
             style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e2e8f0">
          <div class="text-muted fs-13">
            Showing <span th:text="${products.number * products.size + 1}"></span>
            &ndash; <span th:text="${products.number * products.size + products.numberOfElements}"></span>
            of <span th:text="${products.totalElements}"></span>
          </div>
          <nav>
            <ul class="pagination mb-0">
              <li class="page-item" th:classappend="${!products.hasPreviousPage()} ? 'disabled'">
                <a class="page-link" th:href="@{/products(search=${search},category=${category},stockStatus=${stockStatus},sort=${sort},dir=${dir},page=${products.number-1})}">&#9664;</a>
              </li>
              <li th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                  class="page-item" th:classappend="${i == products.number} ? 'active'">
                <a class="page-link" th:href="@{/products(search=${search},category=${category},stockStatus=${stockStatus},sort=${sort},dir=${dir},page=${i})}" th:text="${i + 1}"></a>
              </li>
              <li class="page-item" th:classappend="${!products.hasNextPage()} ? 'disabled'">
                <a class="page-link" th:href="@{/products(search=${search},category=${category},stockStatus=${stockStatus},sort=${sort},dir=${dir},page=${products.number+1})}">&#9654;</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
