# ======================================================
# DEV Profile - Uses H2 in-memory database
# No MySQL installation required.
# Run with: mvnw.cmd spring-boot:run
#   (SPRING_PROFILES_ACTIVE=dev is the default)
# ======================================================

# ---- H2 In-Memory Database ----
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- H2 Console (dev only) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---- Thymeleaf (disable cache for hot reload) ----
spring.thymeleaf.cache=false
