<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transaction History - InvenTrack</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: sidebar('history')}"></div>
  <div class="main-content">
    <header class="top-header">
      <div>
        <div class="page-title">Transaction History</div>
        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item active">All Stock Movements</li></ol></nav>
      </div>
      <a th:href="@{/stock}" class="btn btn-primary btn-sm">&#128260; New Movement</a>
    </header>
    <main class="content-area">
      <div class="content-card">
        <div th:if="${transactions.content.isEmpty()}" class="empty-state">
          <div class="empty-icon">&#128203;</div>
          <h5>No transactions yet</h5>
          <p>Record your first <a th:href="@{/stock}">stock movement</a> to see it here.</p>
        </div>
        <div th:unless="${transactions.content.isEmpty()}" style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Date &amp; Time</th>
                <th>Product</th>
                <th>SKU</th>
                <th>Type</th>
                <th>Quantity</th>
                <th>Remarks</th>
                <th>By</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="t,iter : ${transactions.content}">
                <td class="text-muted fs-12" th:text="${transactions.number * transactions.size + iter.index + 1}"></td>
                <td class="text-muted fs-12" th:text="${#temporals.format(t.transactionDate,'dd MMM yyyy HH:mm')}"></td>
                <td>
                  <a th:href="@{/products/{id}(id=${t.product.id})}" th:text="${t.product.name}"
                     style="color:inherit;text-decoration:none;font-weight:600"></a>
                </td>
                <td><code th:text="${t.product.sku}"></code></td>
                <td>
                  <span class="stock-badge"
                        th:classappend="${t.transactionType.name() == 'STOCK_IN'} ? 'tx-in' : 'tx-out'"
                        th:text="${t.transactionType.displayName}"></span>
                </td>
                <td class="fw-600" th:text="${t.quantity}"></td>
                <td class="text-muted fs-12" th:text="${t.remarks ?: '-'}"></td>
                <td class="text-muted fs-12" th:text="${t.createdBy}"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div th:if="${transactions.totalPages > 1}"
             style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e2e8f0">
          <div class="text-muted fs-13">
            Showing <span th:text="${transactions.number * transactions.size + 1}"></span>
            &ndash; <span th:text="${transactions.number * transactions.size + transactions.numberOfElements}"></span>
            of <span th:text="${transactions.totalElements}"></span>
          </div>
          <nav>
            <ul class="pagination mb-0">
              <li class="page-item" th:classappend="${!transactions.hasPreviousPage()} ? 'disabled'">
                <a class="page-link" th:href="@{/stock/history(page=${transactions.number-1})}">&#9664;</a>
              </li>
              <li th:each="i : ${#numbers.sequence(0, transactions.totalPages-1)}"
                  class="page-item" th:classappend="${i == transactions.number} ? 'active'">
                <a class="page-link" th:href="@{/stock/history(page=${i})}" th:text="${i+1}"></a>
              </li>
              <li class="page-item" th:classappend="${!transactions.hasNextPage()} ? 'disabled'">
                <a class="page-link" th:href="@{/stock/history(page=${transactions.number+1})}">&#9654;</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
